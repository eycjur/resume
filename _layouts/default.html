<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ja' }}">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <script>document.documentElement.classList.add('js');</script>

{% seo %}
    {% include head-custom.html %}
  </head>

  <body>
    <header class="site-header">
      <div class="site-header-inner">
        {% if page.lang == 'en' %}
          <a class="brand" href="{{ '/en/' | relative_url }}">kmuto<span class="brand-dot">.</span></a>
        {% else %}
          <a class="brand" href="{{ '/ja/' | relative_url }}">kmuto<span class="brand-dot">.</span></a>
        {% endif %}
        <nav class="site-nav" aria-label="Site">
          {% if page.lang == 'en' %}
            <a href="{{ '/en/' | relative_url }}" aria-current="page">About</a>
            <a href="{{ '/ja/' | relative_url }}" lang="ja">日本語</a>
          {% else %}
            <a href="{{ '/ja/' | relative_url }}"{% unless page.nav == 'products' %} aria-current="page"{% endunless %}>About</a>
            <a href="{{ '/ja/products/' | relative_url }}"{% if page.nav == 'products' %} aria-current="page"{% endif %}>Products</a>
            <a href="{{ '/en/' | relative_url }}" lang="en">English</a>
          {% endif %}
          <a href="https://github.com/eycjur" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <p class="footer-name">kmuto — Software Engineer</p>
        <p class="footer-meta">
          <a href="https://x.com/eycjur" target="_blank" rel="noopener noreferrer">X</a>
          <a href="https://github.com/eycjur" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://qiita.com/eycjur" target="_blank" rel="noopener noreferrer">Qiita</a>
          <a href="https://www.linkedin.com/in/katsuhiro-muto-00934b1b7/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </p>
        <p class="footer-credit">Published with <a href="https://pages.github.com">GitHub Pages</a></p>
      </div>
    </footer>

    <script>
      (function () {
        var targets = document.querySelectorAll('.reveal');
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced || !('IntersectionObserver' in window)) {
          targets.forEach(function (el) { el.classList.add('is-visible'); });
          return;
        }
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              io.unobserve(entry.target);
            }
          });
        }, { rootMargin: '0px 0px -8% 0px' });
        targets.forEach(function (el) { io.observe(el); });
      })();
    </script>
  </body>
</html>
